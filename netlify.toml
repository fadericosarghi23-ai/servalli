# Deploy statico su Netlify.
# Il dominio canonico è in astro.config.mjs (SITE_URL) e in src/data/site.ts (dominio).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5.18 usa rolldown/vite 8: servono engine recenti
  NODE_VERSION = "20"
  # il lockfile generato su Windows fa saltare il binding nativo per Linux (npm#4828):
  # su Netlify si installa fresco
  NPM_FLAGS = "--no-package-lock"

# Redirect 301 dai vecchi URL del sito Drupal (servalliarchitettura.it/it/...) alle nuove rotte.
# La versione inglese (/en/) non è stata portata: rimanda alla home.
[[redirects]]
  from = "/it"
  to = "/"
  status = 301

